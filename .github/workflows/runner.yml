name: Semi-Live AI Trading Bot

on:
  schedule:
    # every 5 min, 13:00-21:59 UTC = covers US market hours in summer AND winter time
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write        # needed so the bot can commit state/memory.json

concurrency:
  group: trading-bot     # never two runs at the same time
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Bot Execution
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save memory (external memory commit)
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: update state [skip ci]"
          file_pattern: state/memory.json
